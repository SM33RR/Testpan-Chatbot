<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Chat Widget</title>

    <style>
        /* Ensure the widget container fills the iframe */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
    </style>
</head>

<body>
    <!-- Dependencies for the chat widget -->
    <script>
        // Dynamically add cache-busting query strings to the script and stylesheet
        // to ensure the browser always loads the latest version during development.
        const cacheBuster = `v=${new Date().getTime()}`;
        document.write(`<script src="https://cdn.socket.io/4.7.2/socket.io.min.js?${cacheBuster}"><\/script>`);
        document.write(`<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js?${cacheBuster}"><\/script>`);
        document.write(`<script src="/chatWidget.js?${cacheBuster}"><\/script>`);
        document.write(`<link rel="stylesheet" href="/style.css?${cacheBuster}">`);
    </script>


</body>
</html>
