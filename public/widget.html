<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chat Widget</title>
    <style>
        /* Ensure the widget container fills the iframe */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Hide scrollbars from the body */
            background-color: transparent; /* Ensure no white background from the iframe body */
        }
    </style>
</head>
<body>
    <!-- The loader will inject Socket.IO, CSS, and the widget script -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/widgetLoader.js"></script>
</body>
</html>
